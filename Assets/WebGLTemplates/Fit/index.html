<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      The web demo's page (Docs/WebDemo.md), made from Unity's Minimal template. Unlike Unity's own templates, the
      game fills the browser window on a PC as well as on a phone, so a small window shows all of it instead of a
      fixed 960x600 area with scroll bars. ProjectSetup.UseWebSettings picks it (PROJECT:Fit).
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0A0A0F; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #0A0A0F; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 280px; max-width: 70%;
                 color: #EFE6D6; font: 16px sans-serif; text-align: center; }
      #loading .bar { margin-top: 10px; height: 12px; border: 2px solid #7A6450; background: #17120F; }
      #loading .fill { width: 0; height: 100%; background: #D24A3C; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">불러오는 중…<div class="bar"><div class="fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      // Tab opens the bag; the browser would otherwise move its focus off the game with it, and the next key or
      // click would only bring the focus back.
      window.addEventListener("keydown", function (e) {
        if (e.key === "Tab") e.preventDefault();
      });
      canvas.addEventListener("pointerdown", function () {
        canvas.focus();
      });

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        loading.querySelector(".fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        loading.textContent = "불러오지 못했습니다: " + message;
      });
    </script>
  </body>
</html>
