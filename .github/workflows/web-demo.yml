name: Web demo

# Builds the game for WebGL in GameCI's Unity image and publishes it to GitHub Pages, so the latest main can be
# played in a browser, phones included. Needs the UNITY_EMAIL and UNITY_PASSWORD secrets of a Unity account with a
# Personal license, and Pages set to "GitHub Actions" (LOCAL_TASKS.md, 웹 데모용). Until the secrets exist the build
# is skipped with a notice instead of failing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - 'DevTools/**'
  workflow_dispatch:

concurrency:
  group: web-demo
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Web demo skipped::Add the UNITY_EMAIL and UNITY_PASSWORD secrets to build the web demo (LOCAL_TASKS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      # The Unity WebGL image is several GB; the runner's preinstalled SDKs are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: library-webgl-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: library-webgl-

      # GameCI's image for the project's Unity version, with WebGL support.
      - name: Pull the Unity image
        id: image
        run: |
          version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          image="unityci/editor:ubuntu-$version-webgl-3"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker pull --quiet "$image"

      # Activates Unity Personal, builds into build/web and returns the license (.github/scripts/build-web.sh).
      - name: Build
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: >-
          docker run --rm
          --env UNITY_EMAIL --env UNITY_PASSWORD
          --volume "$GITHUB_WORKSPACE:/project" --workdir /project
          "${{ steps.image.outputs.image }}"
          bash .github/scripts/build-web.sh build/web

      # The container ran as root; hand the files back so the Library cache can be saved.
      - name: Fix file ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
