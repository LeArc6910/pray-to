name: Core tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test DevTools/Game.Core.Tests --logger "console;verbosity=normal"

      - name: Build sandbox
        run: dotnet build DevTools/CoreSandbox

      # Unity's engine assemblies for the project's version, extracted once and then cached.
      - name: Cache Unity assemblies
        uses: actions/cache@v4
        with:
          path: DevTools/UnityCompileCheck/.unity
          key: unity-assemblies-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}

      - name: Fetch Unity assemblies
        run: bash DevTools/UnityCompileCheck/fetch-unity.sh

      - name: Compile-check Unity scripts
        run: dotnet build DevTools/UnityCompileCheck

      # The local setup scripts, run against a stand-in for Unity. The runner image has ShellCheck and PowerShell.
      - name: Check local setup scripts
        run: |
          shellcheck DevTools/Local/setup.sh DevTools/Local/test/run.sh DevTools/Local/test/fake-unity
          bash DevTools/Local/test/run.sh
