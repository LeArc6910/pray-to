name: CI autofix

# When the Core tests workflow fails on main, Claude reads the failing job's log, finds the cause and opens a pull
# request with a fix for a person to review (Docs/Research2026-11.md candidate 19, Docs/Release.md CI 자동 수정).
# It never pushes to main itself. Needs the ANTHROPIC_API_KEY secret (LOCAL_TASKS.md 121단계); until it exists the
# job is skipped with a notice instead of failing.
#
# Guards against loops: it does not run for a failure on a branch it made (claude/autofix-*), nor twice for the same
# commit (the concurrency group is the commit), and it gives up after one attempt; a fix that fails again waits for
# a person.
on:
  workflow_run:
    workflows: [Core tests]
    types: [completed]

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secret.outputs.ready }}
    steps:
      - id: secret
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; CI autofix is skipped (LOCAL_TASKS.md 121단계)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  fix:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Failing log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed > failed.log || true
          tail -c 60000 failed.log > failed-tail.log
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            The Core tests workflow failed on main at commit ${{ github.event.workflow_run.head_sha }}.
            Its failing log is in failed-tail.log. Read CLAUDE.md first and follow its rules (Korean docs, English
            commit messages, author LeArc6910 <270705266+LeArc6910@users.noreply.github.com>, no tool lines).
            Find the root cause, not the symptom. Make the smallest fix, run `dotnet test DevTools/Game.Core.Tests`
            and, if the failure was in Unity-side code, the compile check the log names. Never skip, disable or
            weaken a test to make it pass. Commit on a new branch named claude/autofix-${{ github.event.workflow_run.head_sha }}
            and open a pull request to main that says what failed, why, and what the fix changes. Do not push to main.
            If you cannot find a cause you are sure of, open an issue with what you found instead of a pull request.
